services:
  zcode-proxy:
    image: ghcr.io/swallowdili/zcode-proxy:latest   # GitHub Actions 构建推送；本地构建用: build: .
    container_name: zcode-proxy
    ports:
      - "8787:8787"
    volumes:
      - ./state:/data/state   # 首次部署：把 zcode-system-prompt.json 放进 ./state/
    environment:
      - ZPROXY_HOST=0.0.0.0   # 容器内监听所有接口，否则端口映射后外部无法访问
    restart: unless-stopped
